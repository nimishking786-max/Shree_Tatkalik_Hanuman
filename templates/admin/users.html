{% extends "admin/layout.html" %}
{% block content %}
<h2 class="mt-4">Manage Admin Users</h2>
<div class="card mb-4">
    <div class="card-header">Add New User</div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin_user_add') }}">
            <div class="row">
                <div class="col-md-3"><input type="text" name="username" class="form-control" placeholder="Username" required></div>
                <div class="col-md-3"><input type="email" name="email" class="form-control" placeholder="Email" required></div>
                <div class="col-md-3"><input type="password" name="password" class="form-control" placeholder="Password" required></div>
                <div class="col-md-2">
    <label>Role</label>
    <select name="role" class="form-select">
        <option value="user">User</option>
        <option value="darshan_manager">Darshan Manager</option>
        <option value="admin">Admin</option>
    </select>
</div>
                <div class="col-md-1"><button type="submit" class="btn btn-primary">Add</button></div>
            </div>
        </form>
    </div>
</div>
<table class="table">
    <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Admin</th><th>Actions</th></tr></thead>
    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ u.id }}</td><td>{{ u.username }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td>
            <td>{% if u.is_admin %}<span class="badge bg-success">Yes</span>{% else %}No{% endif %}</td>
            <td><a href="{{ url_for('admin_user_delete', id=u.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')">Delete</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
