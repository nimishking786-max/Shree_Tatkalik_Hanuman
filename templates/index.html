<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shree Tatkalik Hanuman | 3D Temple</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background-color: #050510;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255,215,0,0.8);
            z-index: 100;
            pointer-events: none;
            animation: glow 3s infinite alternate;
        }
        #info h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 8px;
            font-weight: 600;
        }
        #info p {
            font-size: 1.2rem;
            margin: 5px 0 0;
            opacity: 0.9;
            color: #fff3e0;
        }
        @keyframes glow {
            from { text-shadow: 0 0 15px #ffaa00, 0 0 30px #ff5500; }
            to { text-shadow: 0 0 25px #ffdd44, 0 0 50px #ff8800; }
        }
        #footer {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ccc;
            font-size: 0.9rem;
            z-index: 100;
            pointer-events: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            z-index: 200;
            font-size: 1.5rem;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 30px;
            transition: opacity 1s;
        }
    </style>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading">॥ ॐ हनुमते नमः ॥</div>
    <div id="info">
        <h1>श्री तत्कालिक हनुमान</h1>
        <p>Shree Tatkalik Hanuman</p>
    </div>
    <div id="footer">🙏 जय बजरंग बली 🙏</div>

    <!-- Three.js Libraries -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Initialize Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510); // deep night sky
        
        // --- Camera ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 8, 18);
        camera.lookAt(0, 3, 0);
        
        // --- Renderers ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        // CSS2 Renderer for labels
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';  // allow clicking through to canvas
        document.body.appendChild(labelRenderer.domElement);
        
        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 10;
        controls.maxDistance = 25;
        controls.target.set(0, 3.5, 0);
        
        // --- Lighting ---
        // Ambient base
        scene.add(new THREE.AmbientLight(0x404060, 0.45));
        
        // Main directional light (sun)
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(10, 20, 5);
        sunLight.castShadow = true;
        sunLight.receiveShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        const d = 15;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 40;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);
        
        // Fill lights
        const fillLight1 = new THREE.PointLight(0xffaa66, 0.8);
        fillLight1.position.set(-5, 8, 10);
        scene.add(fillLight1);
        
        const fillLight2 = new THREE.PointLight(0x6688ff, 0.6);
        fillLight2.position.set(8, 6, -10);
        scene.add(fillLight2);
        
        // Back rim light
        const backLight = new THREE.PointLight(0xff9933, 0.5);
        backLight.position.set(-5, 5, -12);
        scene.add(backLight);
        
        // Ground spotlights for dramatic effect
        const spotLight1 = new THREE.SpotLight(0xffaa33, 0.8);
        spotLight1.position.set(3, 5, 4);
        spotLight1.angle = 0.3;
        spotLight1.penumbra = 0.5;
        spotLight1.decay = 1;
        spotLight1.distance = 30;
        spotLight1.castShadow = true;
        spotLight1.target.position.set(0, 1, 0);
        scene.add(spotLight1);
        scene.add(spotLight1.target);
        
        const spotLight2 = new THREE.SpotLight(0x3366ff, 0.5);
        spotLight2.position.set(-4, 5, 3);
        spotLight2.angle = 0.4;
        spotLight2.penumbra = 0.5;
        spotLight2.decay = 1;
        spotLight2.distance = 30;
        spotLight2.castShadow = true;
        spotLight2.target.position.set(0, 1, 0);
        scene.add(spotLight2);
        scene.add(spotLight2.target);
        
        // --- Background Stars / Particles (spiritual aura) ---
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            // Spread in a sphere
            const r = 50 + Math.random() * 80;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            starPositions[i] = Math.sin(phi) * Math.cos(theta) * r;
            starPositions[i+1] = Math.sin(phi) * Math.sin(theta) * r;
            starPositions[i+2] = Math.cos(phi) * r;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.15,
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);
        
        // Floating glowing particles around temple
        const glowParticlesGeo = new THREE.SphereGeometry(0.08);
        const glowParticlesMat = new THREE.MeshStandardMaterial({
            color: 0xffaa33,
            emissive: 0xff5500,
            emissiveIntensity: 0.8
        });
        const particlesGroup = new THREE.Group();
        for (let i = 0; i < 30; i++) {
            const particle = new THREE.Mesh(glowParticlesGeo, glowParticlesMat.clone());
            const angle = (i / 30) * Math.PI * 2;
            const radius = 5.5 + Math.random() * 2;
            particle.position.x = Math.cos(angle) * radius;
            particle.position.z = Math.sin(angle) * radius;
            particle.position.y = 2 + Math.random() * 5;
            particle.castShadow = true;
            particlesGroup.add(particle);
        }
        scene.add(particlesGroup);
        
        // --- Ground Plane ---
        const groundGeometry = new THREE.CircleGeometry(30, 32);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a1e0f,
            roughness: 0.8,
            metalness: 0.1,
            side: THREE.DoubleSide
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Decorative ground pattern (concentric rings)
        const ringGeo = new THREE.TorusGeometry(4.5, 0.08, 16, 100);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xc99a3b, emissive: 0x442200, emissiveIntensity: 0.3 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.01;
        ring.receiveShadow = true;
        scene.add(ring);
        
        const ring2Geo = new THREE.TorusGeometry(7, 0.1, 16, 100);
        const ring2Mat = new THREE.MeshStandardMaterial({ color: 0xb8862d, emissive: 0x331100, emissiveIntensity: 0.2 });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        ring2.rotation.x = Math.PI / 2;
        ring2.position.y = 0.02;
        ring2.receiveShadow = true;
        scene.add(ring2);
        
        // --- Temple Construction ---
        const templeGroup = new THREE.Group();
        
        // Materials
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.6, metalness: 0.1 });
        const darkStoneMat = new THREE.MeshStandardMaterial({ color: 0x8b5e3c, roughness: 0.7 });
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3, metalness: 0.7, emissive: 0x442200, emissiveIntensity: 0.2 });
        const redMat = new THREE.MeshStandardMaterial({ color: 0xb22222, roughness: 0.5 });
        const whiteMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.4 });
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0xbc8f8f, roughness: 0.5, emissive: 0x331100, emissiveIntensity: 0.1 });
        
        // 1. Base platform (Jagati)
        const baseGeo = new THREE.BoxGeometry(8, 0.6, 8);
        const base = new THREE.Mesh(baseGeo, stoneMat);
        base.position.y = 0.3;
        base.receiveShadow = true;
        base.castShadow = true;
        templeGroup.add(base);
        
        // Base steps (front)
        const step1Geo = new THREE.BoxGeometry(4, 0.3, 1.5);
        const step1 = new THREE.Mesh(step1Geo, stoneMat);
        step1.position.set(0, 0.15, 4.2);
        step1.receiveShadow = true;
        step1.castShadow = true;
        templeGroup.add(step1);
        
        const step2Geo = new THREE.BoxGeometry(3.2, 0.3, 1.2);
        const step2 = new THREE.Mesh(step2Geo, stoneMat);
        step2.position.set(0, 0.45, 4.8);
        step2.receiveShadow = true;
        step2.castShadow = true;
        templeGroup.add(step2);
        
        // 2. Main sanctum (Garbhagriha) - lower walls
        const sanctumBaseGeo = new THREE.BoxGeometry(4.8, 2.2, 4.8);
        const sanctumBase = new THREE.Mesh(sanctumBaseGeo, darkStoneMat);
        sanctumBase.position.y = 1.4;
        sanctumBase.receiveShadow = true;
        sanctumBase.castShadow = true;
        templeGroup.add(sanctumBase);
        
        // Inner chamber hint (darker)
        const innerGeo = new THREE.BoxGeometry(3.0, 1.8, 3.0);
        const innerMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, emissive: 0x221100, emissiveIntensity: 0.5 });
        const inner = new THREE.Mesh(innerGeo, innerMat);
        inner.position.y = 1.3;
        inner.receiveShadow = true;
        inner.castShadow = true;
        templeGroup.add(inner);
        
        // 3. Pillars (4 corners)
        const pillarGeo = new THREE.CylinderGeometry(0.45, 0.5, 2.4, 8);
        const positions = [
            [-1.8, 1.5, -1.8], [1.8, 1.5, -1.8], [-1.8, 1.5, 1.8], [1.8, 1.5, 1.8]
        ];
        positions.forEach(pos => {
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            pillar.position.set(pos[0], pos[1], pos[2]);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            templeGroup.add(pillar);
            
            // Pillar capital
            const capitalGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.2, 8);
            const capital = new THREE.Mesh(capitalGeo, goldMat);
            capital.position.set(pos[0], pos[1]+1.1, pos[2]);
            capital.castShadow = true;
            capital.receiveShadow = true;
            templeGroup.add(capital);
        });
        
        // Additional front pillars
        const frontPillarPos = [[-1.5, 1.5, 2.4], [1.5, 1.5, 2.4]];
        frontPillarPos.forEach(pos => {
            const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 2.2, 8), pillarMat);
            pillar.position.set(pos[0], pos[1], pos[2]);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            templeGroup.add(pillar);
        });
        
        // 4. Roof / Entablature
        const roofGeo = new THREE.BoxGeometry(5.2, 0.4, 5.2);
        const roof = new THREE.Mesh(roofGeo, stoneMat);
        roof.position.y = 2.6;
        roof.castShadow = true;
        roof.receiveShadow = true;
        templeGroup.add(roof);
        
        // Decorative band
        const bandGeo = new THREE.BoxGeometry(5.4, 0.1, 5.4);
        const band = new THREE.Mesh(bandGeo, goldMat);
        band.position.y = 2.8;
        band.castShadow = true;
        band.receiveShadow = true;
        templeGroup.add(band);
        
        // 5. Shikhara (Spire) - Nagara style
        const shikharaGroup = new THREE.Group();
        
        // Main tower
        const towerGeo = new THREE.ConeGeometry(2.2, 3.8, 8);
        const tower = new THREE.Mesh(towerGeo, new THREE.MeshStandardMaterial({ color: 0xcd9a5b, roughness: 0.5 }));
        tower.position.y = 4.9;
        tower.castShadow = true;
        tower.receiveShadow = true;
        shikharaGroup.add(tower);
        
        // Vertical bands (rekha)
        for (let i = 0; i < 4; i++) {
            const bandStripGeo = new THREE.BoxGeometry(0.15, 3.6, 0.3);
            const bandStrip = new THREE.Mesh(bandStripGeo, goldMat);
            bandStrip.position.y = 4.8;
            bandStrip.position.x = Math.sin(i * Math.PI/2) * 1.8;
            bandStrip.position.z = Math.cos(i * Math.PI/2) * 1.8;
            bandStrip.castShadow = true;
            shikharaGroup.add(bandStrip);
        }
        
        // Amalaka (ribbed disc on top)
        const amalakaGeo = new THREE.TorusGeometry(0.9, 0.25, 8, 20);
        const amalaka = new THREE.Mesh(amalakaGeo, goldMat);
        amalaka.position.y = 6.8;
        amalaka.rotation.x = Math.PI / 2;
        amalaka.castShadow = true;
        shikharaGroup.add(amalaka);
        
        // Kalash (pot)
        const kalashBaseGeo = new THREE.SphereGeometry(0.55, 16, 8);
        const kalashBase = new THREE.Mesh(kalashBaseGeo, goldMat);
        kalashBase.position.y = 7.3;
        kalashBase.scale.set(1, 0.6, 1);
        kalashBase.castShadow = true;
        shikharaGroup.add(kalashBase);
        
        const kalashNeckGeo = new THREE.CylinderGeometry(0.25, 0.3, 0.4, 8);
        const kalashNeck = new THREE.Mesh(kalashNeckGeo, goldMat);
        kalashNeck.position.y = 7.65;
        kalashNeck.castShadow = true;
        shikharaGroup.add(kalashNeck);
        
        const kalashTopGeo = new THREE.SphereGeometry(0.35, 8);
        const kalashTop = new THREE.Mesh(kalashTopGeo, goldMat);
        kalashTop.position.y = 7.9;
        kalashTop.castShadow = true;
        shikharaGroup.add(kalashTop);
        
        // Finial
        const finialGeo = new THREE.ConeGeometry(0.15, 0.5, 6);
        const finial = new THREE.Mesh(finialGeo, goldMat);
        finial.position.y = 8.25;
        finial.castShadow = true;
        shikharaGroup.add(finial);
        
        templeGroup.add(shikharaGroup);
        
        // 6. Dhwaja (Flag) on top
        const flagPoleGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.8, 6);
        const flagPole = new THREE.Mesh(flagPoleGeo, new THREE.MeshStandardMaterial({ color: 0xcd7f32 }));
        flagPole.position.y = 8.8;
        flagPole.position.x = 0.2;
        flagPole.castShadow = true;
        templeGroup.add(flagPole);
        
        const flagGeo = new THREE.BoxGeometry(0.8, 0.5, 0.02);
        const flagMat = new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: 0x441100 });
        const flag = new THREE.Mesh(flagGeo, flagMat);
        flag.position.set(0.6, 8.5, 0);
        flag.castShadow = true;
        templeGroup.add(flag);
        
        // Flag text using CSS2DRenderer
        const flagLabelDiv = document.createElement('div');
        flagLabelDiv.textContent = '॥ ॐ ॥';
        flagLabelDiv.style.color = '#ffaa00';
        flagLabelDiv.style.fontSize = '24px';
        flagLabelDiv.style.fontWeight = 'bold';
        flagLabelDiv.style.textShadow = '0 0 10px #ff5500';
        flagLabelDiv.style.fontFamily = 'Poppins, sans-serif';
        const flagLabel = new CSS2DObject(flagLabelDiv);
        flagLabel.position.set(0.6, 8.5, 0.1);
        templeGroup.add(flagLabel);
        
        // 7. Entrance arch (Torana)
        const archPillarL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.0, 0.4), goldMat);
        archPillarL.position.set(-1.6, 1.8, 2.8);
        archPillarL.castShadow = true;
        archPillarL.receiveShadow = true;
        templeGroup.add(archPillarL);
        
        const archPillarR = archPillarL.clone();
        archPillarR.position.set(1.6, 1.8, 2.8);
        templeGroup.add(archPillarR);
        
        const archBeam = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.3, 0.4), goldMat);
        archBeam.position.set(0, 2.8, 2.8);
        archBeam.castShadow = true;
        archBeam.receiveShadow = true;
        templeGroup.add(archBeam);
        
        // Add temple to scene
        scene.add(templeGroup);
        
        // --- Divine Light (inner glow) ---
        const innerLight = new THREE.PointLight(0xffaa33, 1.5);
        innerLight.position.set(0, 1.8, 0);
        scene.add(innerLight);
        
        // --- Hovering deity idol placeholder (abstract) ---
        const idolGroup = new THREE.Group();
        const idolBase = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.9, 0.2, 6), goldMat);
        idolBase.position.y = 0.8;
        idolBase.castShadow = true;
        idolBase.receiveShadow = true;
        idolGroup.add(idolBase);
        
        const idolBody = new THREE.Mesh(new THREE.ConeGeometry(0.6, 1.2, 5), redMat);
        idolBody.position.y = 1.5;
        idolBody.castShadow = true;
        idolBody.receiveShadow = true;
        idolGroup.add(idolBody);
        
        const idolHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
        idolHead.position.y = 2.1;
        idolHead.castShadow = true;
        idolHead.receiveShadow = true;
        idolGroup.add(idolHead);
        
        idolGroup.position.set(0, 1.0, 0);
        scene.add(idolGroup);
        
        // CSS2D Label for sanctum
        const sanctumLabelDiv = document.createElement('div');
        sanctumLabelDiv.textContent = '🙏 श्री राम 🙏';
        sanctumLabelDiv.style.color = '#ffd700';
        sanctumLabelDiv.style.fontSize = '20px';
        sanctumLabelDiv.style.fontWeight = 'bold';
        sanctumLabelDiv.style.textShadow = '0 0 15px #ff8c00';
        sanctumLabelDiv.style.fontFamily = 'Poppins, sans-serif';
        sanctumLabelDiv.style.whiteSpace = 'nowrap';
        const sanctumLabel = new CSS2DObject(sanctumLabelDiv);
        sanctumLabel.position.set(0, 2.5, 0.5);
        scene.add(sanctumLabel);
        
        // --- Environment: Trees / Nature (simple) ---
        function addTree(x, z, scale) {
            const treeGroup = new THREE.Group();
            const trunkGeo = new THREE.CylinderGeometry(0.3 * scale, 0.4 * scale, 1.8 * scale);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5e3c });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 0.9 * scale;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            treeGroup.add(trunk);
            
            const foliageGeo = new THREE.ConeGeometry(1.0 * scale, 1.8 * scale, 8);
            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27 });
            const foliage = new THREE.Mesh(foliageGeo, foliageMat);
            foliage.position.y = 1.8 * scale;
            foliage.castShadow = true;
            foliage.receiveShadow = true;
            treeGroup.add(foliage);
            
            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
        }
        
        addTree(-8, -6, 1.2);
        addTree(9, -5, 1.0);
        addTree(-7, 8, 1.1);
        addTree(8, 7, 1.0);
        addTree(-10, 2, 1.3);
        addTree(10, -1, 1.2);
        
        // --- Animation Loop ---
        let clock = new THREE.Clock();
        
        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = performance.now() * 0.001; // seconds
            
            // Auto-rotate via OrbitControls
            controls.update();
            
            // Animate particles
            particlesGroup.children.forEach((particle, i) => {
                const angle = (i / particlesGroup.children.length) * Math.PI * 2 + elapsedTime * 0.1;
                const radius = 5.5;
                particle.position.x = Math.cos(angle) * radius;
                particle.position.z = Math.sin(angle) * radius;
                particle.position.y = 2.5 + Math.sin(elapsedTime * 2 + i) * 1.2;
            });
            
            // Rotate stars slowly
            stars.rotation.y += 0.0005;
            
            // Pulse inner light
            innerLight.intensity = 1.5 + Math.sin(elapsedTime * 3) * 0.3;
            
            // Flag wave effect
            flag.rotation.z = Math.sin(elapsedTime * 5) * 0.05;
            
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        // --- Handle Window Resize ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Hide loading text after a short delay
        setTimeout(() => {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 1000);
        }, 1500);
        
        console.log('॥ जय श्री राम ॥');
    </script>
</body>
</html>
